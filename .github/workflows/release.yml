name: release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BYPY_ROOT: /Users/runner/bypy-root
  BYPY_UNIVERSAL: 'true'
  BYPY_DEPLOY_TARGET: '12.0'

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: version
        id: v
        run: |
          set -euo pipefail
          base=$(sed -n 's/^version: Version = Version(\([0-9]*\), *\([0-9]*\), *\([0-9]*\)).*/\1.\2.\3/p' kitty/constants.py)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pkgver=$base.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: seed what setup.py expects a built tree to already have
        run: |
          set -euo pipefail
          h=kitty/launcher/cli-parser-data_generated.h
          python3 -c "
          import runpy, sys
          sys.running_from_setup = True
          m = runpy.run_path('kitty/simple_cli_definitions.py', {'appname': 'kitty'})
          open('$h', 'w').write('\n'.join(m['generate_c_parsers']()))
          "
          grep -q 'generated by simple_cli_definitions' "$h"
          mkdir -p docs/_build/man docs/_build/html
          mkdir -p fonts
          curl -fsSL -o fonts/SymbolsNerdFontMono-Regular.ttf \
            https://github.com/ryanoasis/nerd-fonts/raw/v3.5.1/patched-fonts/NerdFontsSymbolsOnly/SymbolsNerdFontMono-Regular.ttf
          echo "fe471e538392f51910faab985fa8e192a39dd3426125edd15b71b3680df0e749  fonts/SymbolsNerdFontMono-Regular.ttf" | shasum -a 256 -c -

      - name: prerequisites
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages certifi meson ninja
          sudo mkdir -p /usr/local/bin
          [ -e /usr/local/bin/python3 ] || sudo ln -s "$(command -v python3)" /usr/local/bin/python3
          for t in meson ninja; do
            sudo ln -sfn "$(command -v "$t")" "/usr/local/bin/$t"
          done
          sanitized=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v homebrew | paste -sd: -)
          PATH="$sanitized" command -v python3 meson ninja
          mkdir -p "$BYPY_ROOT"/{sources,sw}
          ln -sfn "$GITHUB_WORKSPACE" "$BYPY_ROOT/src"

      - name: bypy
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kovidgoyal/bypy.git "$BYPY_ROOT/bypy"
          sed -i '' '/^def get_git_with_submodules/,/^def /s/^    if not pkg\.verify_hash(path):$/    if False:/' \
            "$BYPY_ROOT/bypy/bypy/download_sources.py"
          grep -q 'if False:' "$BYPY_ROOT/bypy/bypy/download_sources.py"
          python3 - "$BYPY_ROOT/bypy/bypy/macos_sign.py" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          subs = (
              (
                  """cert_id = re.search(r'"([^"]+)"', raw).group(1)""",
                  """cert_id = re.search(r'"(Developer ID Application[^"]+)"', raw).group(1)\n"""
                  """        os.environ['CODESIGN_IDENTITY'] = cert_id""",
              ),
              ("'-s', 'Kovid Goyal'", "'-s', os.environ['CODESIGN_IDENTITY']"),
          )
          for old, new in subs:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{old!r} matched {n} times, bypy changed shape')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - uses: actions/cache@v4
        with:
          path: |
            /Users/runner/bypy-root/sw
            /Users/runner/bypy-root/sources
          key: bypy-${{ runner.os }}-${{ hashFiles('bypy/sources.json') }}

      - name: adopt the runner cmake
        run: |
          set -euo pipefail
          cmake --version
          mkdir -p "$BYPY_ROOT/sw/pkg/cmake/bin"
          ln -sfn "$(command -v cmake)" "$BYPY_ROOT/sw/pkg/cmake/bin/cmake"
          "$BYPY_ROOT/sw/pkg/cmake/bin/cmake" --version >/dev/null

      - name: signing credentials
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARIZATION_CREDS: ${{ secrets.APPLE_NOTARIZATION_CREDS }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "::warning::MACOS_CERT_P12 is unset, the dmg will be unsigned"
            echo "flags=--non-interactive" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : "${CERT_PASSWORD:?MACOS_CERT_PASSWORD is unset}"
          : "${NOTARIZATION_CREDS:?APPLE_NOTARIZATION_CREDS is unset}"
          mkdir -p ~/code-signing
          printf '%s' "$CERT_P12" | base64 -d > ~/code-signing/maccert.p12
          printf '%s' "$CERT_PASSWORD" > ~/code-signing/cert-cred
          printf '%s' "$NOTARIZATION_CREDS" > ~/code-signing/apple-notarization-creds
          chmod 600 ~/code-signing/maccert.p12 ~/code-signing/cert-cred ~/code-signing/apple-notarization-creds
          echo "flags=--sign-installers --notarize --non-interactive" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: deps
        env:
          BYPY_WORKER: ${{ github.workspace }}
        run: python3 "$BYPY_ROOT/bypy" deps

      - name: program
        env:
          BYPY_WORKER: ${{ github.workspace }}
        run: python3 "$BYPY_ROOT/bypy" program ${{ steps.signing.outputs.flags }}

      - name: stage the artifact
        id: dmg
        run: |
          set -euo pipefail
          src="$BYPY_ROOT/sw/dist/kitty-${{ steps.v.outputs.base }}.dmg"
          [ -f "$src" ] || { echo "no dmg at $src"; ls -la "$BYPY_ROOT/sw/dist" || true; exit 1; }
          out="kitty-${{ steps.v.outputs.pkgver }}.dmg"
          cp "$src" "$out"
          shasum -a 256 "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.v.outputs.pkgver }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "kitty ${{ steps.v.outputs.base }} (cwel fork)"
          gh release upload "$tag" "${{ steps.dmg.outputs.path }}" --clobber
