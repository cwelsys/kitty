name: Release

on:
  push:
    branches: [cwel]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: cwelsys/ci/.github/workflows/fork-release.yml@main
    permissions:
      contents: write
    with:
      version-command: 'sed -n ''s/^version: Version = Version(\([0-9]*\), \([0-9]*\), \([0-9]*\)).*/\1.\2.\3/p'' kitty/constants.py'
